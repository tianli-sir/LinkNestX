openapi: 3.1.0
info:
  title: LinkNestX API
  version: 0.2.0
  description: >-
    Authenticated API for LAN and internet collaboration. Local password accounts
    are the phase-one identity method; optional MFA is a later enhancement.
    Initial-password accounts, including bootstrap administrators, may only use
    login, refresh, logout, me and password change until initialization completes.
    Login/refresh JSON bodies are limited to 8192 bytes and share a bounded
    remote-address rate limit (20-request burst, one token every three seconds).
    Forwarded client-address headers are ignored by default. Deployments behind
    a reverse proxy can explicitly configure LINKNESTX_TRUSTED_PROXY_CIDRS
    (comma-separated CIDRs, for example 127.0.0.1/32 and ::1/128 for a same-host
    proxy). Only a trusted socket peer enables X-Forwarded-For processing; the
    chain is walked right to left until the first untrusted address. Malformed,
    repeated or oversized headers fall back to the socket peer.
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /healthz:
    get:
      operationId: health
      summary: Check server health
      responses:
        '200':
          description: Server is ready to accept requests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } }
      responses:
        '200':
          description: Authenticated session
          content:
            application/json: { schema: { $ref: '#/components/schemas/Session' } }
        '401': { description: Invalid credentials }
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RefreshRequest' } }
      responses:
        '200':
          description: Rotated authenticated session
          content:
            application/json: { schema: { $ref: '#/components/schemas/Session' } }
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses: { '204': { description: Session revoked } }
  /api/v1/me:
    get:
      operationId: currentUser
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current account
          content:
            application/json: { schema: { $ref: '#/components/schemas/User' } }
  /api/v1/users:
    get:
      operationId: userDirectory
      summary: List enabled employees for membership selection
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Only public directory fields
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DirectoryUser' } } }
    post:
      operationId: createUser
      summary: Create a local account (current administrators only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateUserRequest' } }
      responses:
        '201':
          description: Local account created with an initial password
          content:
            application/json: { schema: { $ref: '#/components/schemas/User' } }
        '400': { description: Invalid account input }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
  /api/v1/groups:
    get:
      operationId: listGroups
      summary: List joined groups, or all groups for an administrator (isMember preserves chat separation)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Groups in creation order
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Group' } } }
        '401': { description: Authentication required }
    post:
      operationId: createGroup
      summary: Create a group (administrators only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateGroupRequest' } }
      responses:
        '201':
          description: Group created with its first owner
          content:
            application/json: { schema: { $ref: '#/components/schemas/Group' } }
        '400': { description: Invalid group name }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '404': { description: Owner account does not exist or is disabled }
  /api/v1/groups/{groupId}/members:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listGroupMembers
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Members of the current group
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/GroupMember' } } }
        '401': { description: Authentication required }
        '403': { description: Current group membership or administrator required }
    post:
      operationId: addGroupMember
      summary: Add a member or change their role (group owners or administrators)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/GroupMemberRequest' } }
      responses:
        '204': { description: Membership saved }
        '400': { description: Invalid role or last owner would be demoted }
        '401': { description: Authentication required }
        '403': { description: Group owner or administrator required }
        '404': { description: Group or enabled target account does not exist }
  /api/v1/groups/{groupId}/members/{userId}:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: removeGroupMember
      summary: Remove membership immediately (group owners or administrators)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Membership absent; existing history remains }
        '400': { description: The last owner cannot be removed }
        '401': { description: Authentication required }
        '403': { description: Group owner or administrator required }
        '404': { description: Group does not exist }
  /api/v1/groups/{groupId}/messages:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listGroupMessages
      summary: Fetch durable history after a group cursor
      description: >-
        Messages are returned in ascending commit sequence, including retained
        tombstones. An absent cursor starts at the oldest message. Save nextCursor
        even when hasMore is false and use it to resume after disconnecting.
        Connect the WebSocket first, then fetch history and merge by message ID
        and sequence; this closes the gap between catch-up and live delivery.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: Opaque cursor from this group's previous page or message }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Ordered history page
          content:
            application/json: { schema: { $ref: '#/components/schemas/MessagePage' } }
        '400': { description: Invalid cursor or limit }
        '401': { description: Authentication required }
        '403': { description: Current group membership required }
    post:
      operationId: appendGroupMessage
      summary: Persist a message; retry with the same clientMessageId
      description: >-
        clientMessageId is unique per sender across groups. A retry returns the
        original message. Reuse with another group or different live content
        returns 409. Expired IDs return their content-free tombstone and never
        restore their original body. Sender and group are derived from the
        authenticated request and path, never from JSON actor or group fields.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AppendMessageRequest' } }
      responses:
        '201':
          description: Durable message, including the original on an identical retry
          content:
            application/json: { schema: { $ref: '#/components/schemas/Message' } }
        '400': { description: Invalid input; body is limited to 16384 UTF-8 bytes }
        '401': { description: Authentication required }
        '403': { description: Current group membership required }
        '409': { description: Client message ID reused with different content or group }
  /api/v1/ws:
    get:
      operationId: collaborationSocket
      summary: Native client WebSocket for all currently joined groups
      description: >-
        Upgrade with Authorization Bearer; query-string tokens are not accepted.
        session.ready is the first envelope. Send message.send with requestId,
        groupId, clientMessageId and body. Receive message.ack with requestId,
        clientMessageId and the persisted Message. Newly committed messages emit
        message.created to current group members, including the sender. Identical
        retries emit an acknowledgement without another created event. Use
        message.sequence to order and message.id to merge REST and live events;
        only advance a history cursor after filling any gap via REST.
        presence.changed has groupId, userId and online and is visible only to
        current members sharing that group. Send ping with requestId to receive
        pong. error replies carry requestId and code (invalid_input, forbidden,
        conflict, invalid_event, internal_error). Membership and session state
        are checked on sends and immediately before delivery. Revoked, disabled
        or expired sessions are disconnected on the next event or heartbeat.
        Slow consumers are disconnected and recover through REST cursor catch-up.
        The typed envelope can be extended with P2P events in a later version;
        currently unsupported event types receive invalid_event.
      security: [{ bearerAuth: [] }]
      responses:
        '101': { description: WebSocket upgraded; envelopes follow SocketEvent }
        '400': { description: Invalid upgrade request }
        '401': { description: Authentication required }
  /api/v1/files/uploads:
    post:
      operationId: startFileUpload
      summary: Start a private pending upload; each chunk needs its own verified receipt
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/StartUpload' } }
      responses:
        '201':
          description: Pending upload; no file is published yet
          content:
            application/json: { schema: { $ref: '#/components/schemas/UploadSession' } }
        '400': { description: Invalid bounded manifest or name }
        '403': { description: Current group membership or administrator file-management permission required }
  /api/v1/uploads/{uploadId}:
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: resumeFileUpload
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Original uploader's missing receipts; completed uploads have none
          content:
            application/json: { schema: { $ref: '#/components/schemas/UploadSession' } }
        '403': { description: Original uploader and current permission required }
        '404': { description: Upload expired or file unavailable }
  /api/v1/uploads/{uploadId}/chunks/{index}:
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: index, in: path, required: true, schema: { type: integer, minimum: 0 } }
    put:
      operationId: putFileChunk
      description: Each chunk request has a two-minute body-read deadline. Incomplete requests may be retried against the same upload.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        '204': { description: Exact manifest length and SHA-256 verified; receipt persisted }
        '400': { description: Incorrect index, length, or hash }
        '403': { description: Upload permission revoked }
        '404': { description: Upload expired or file unavailable }
  /api/v1/uploads/{uploadId}/complete:
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: completeFileUpload
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Full server copy verified and atomically published with one group attachment; retry returns the same version
          content:
            application/json: { schema: { $ref: '#/components/schemas/FileVersion' } }
        '400': { description: Whole-file SHA-256 mismatch }
        '409': { description: Upload receipts incomplete or message ID conflict }
  /api/v1/files:
    get:
      operationId: listFiles
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: groupId, in: query, description: 'Supply exactly one of groupId, documentId, or scope=pool', schema: { type: string, format: uuid } }
        - { name: documentId, in: query, schema: { type: string, format: uuid } }
        - { name: scope, in: query, schema: { type: string, enum: [pool] } }
      responses:
        '200':
          description: Accessible published live files
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/File' } } }
        '401': { description: Authentication required }
        '403': { description: Group membership required }
  /api/v1/files/{fileId}/versions:
    parameters:
      - { name: fileId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listFileVersions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Accessible immutable versions; chunks are fetched through each manifest
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FileVersion' } } }
    post:
      operationId: createFileVersion
      summary: Start a pending replacement version through the normal upload flow
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/StartUpload' } }
      responses:
        '201':
          description: Pending upload for the same logical file
          content:
            application/json: { schema: { $ref: '#/components/schemas/UploadSession' } }
  /api/v1/file-versions/{versionId}/manifest:
    parameters:
      - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: fileManifest
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Immutable server-authoritative manifest
          content:
            application/json: { schema: { $ref: '#/components/schemas/FileVersion' } }
        '403': { description: File access denied }
        '404': { description: Version pending, expired, deleted, or absent }
  /api/v1/files/{versionId}/chunks/{hash}:
    parameters:
      - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: hash, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
    get:
      operationId: downloadFileChunk
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: X-Transfer-ID, in: header, description: Native task UUID for aggregate server delivery records; native clients always provide it, schema: { type: string, maxLength: 128 } }
      responses:
        '200':
          description: Entire chunk stream with exact Content-Length; session and permissions rechecked before every bounded write. Revocation stops an in-progress stream and partial responses do not count as completed delivery.
          headers:
            Content-Length: { schema: { type: integer, minimum: 1 } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '403': { description: Current access revoked }
        '404': { description: Version or stored chunk unavailable }
    head:
      operationId: inspectFileChunk
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Authenticated chunk headers only; no bytes delivered or transfer accounting recorded
          headers:
            Content-Length: { schema: { type: integer, minimum: 1 } }
        '403': { description: Current access revoked }
        '404': { description: Version or stored chunk unavailable }
  /api/v1/files/{fileId}/promote:
    parameters:
      - { name: fileId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: promoteFile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Administrator promotion; all live versions lose automatic expiry
          content:
            application/json: { schema: { $ref: '#/components/schemas/File' } }
        '403': { description: Current administrator required }
  /api/v1/files/{fileId}:
    parameters:
      - { name: fileId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: editPoolFile
      summary: Change pool display metadata or reversible listing state (administrator only)
      description: Retains all immutable versions and permanent storage. Unlisted files are inaccessible to employees, including original group members, and remain manageable by administrators.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                listed: { type: boolean }
      responses:
        '204': { description: Metadata/listing state saved and audited }
        '400': { description: Invalid display name, empty edit or non-pool file }
        '403': { description: Administrator required }
        '404': { description: Deleted or missing file }
    delete:
      operationId: deleteFile
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: File unavailable immediately; shared bytes retained until no live references }
        '403': { description: Uploader, group owner, or administrator required; pool files require administrator }
  /api/v1/p2p/announce:
    post:
      operationId: announcePeerChunks
      summary: Replace verified cached chunk indexes for this authenticated device
      description: Discovery hints only. The immutable server manifest defines hash and size. Send only locally verified indexes; an empty list withdraws the version. Session refresh requires re-announcement and WebSocket reconnect.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [versionId, indexes]
              properties:
                versionId: { type: string, format: uuid }
                indexes: { type: array, maxItems: 5000, uniqueItems: true, items: { type: integer, minimum: 0 } }
      responses:
        '204': { description: Announcement replaced; lease is 60 seconds }
        '400': { description: Invalid version or indexes }
        '401': { description: Current authentication required }
        '403': { description: File access denied }
        '404': { description: File unavailable }
        '413': { description: Body exceeds 65536 bytes }
        '429': { description: Device has reached 128 announced versions }
  /api/v1/p2p/heartbeat:
    post:
      operationId: heartbeatPeerSources
      summary: Refresh own existing source leases and bind them to current session
      description: Send every 20 seconds; optional versionId restricts the update. Re-announce after reconnect because expiry cleanup may have removed older rows.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/OptionalPeerVersion' } }
      responses:
        '204': { description: Leases updated }
        '400': { description: Invalid request }
        '401': { description: Current authentication required }
        '403': { description: File access denied }
        '404': { description: File unavailable }
        '413': { description: Body exceeds 65536 bytes }
  /api/v1/p2p/withdraw:
    post:
      operationId: withdrawPeerSources
      summary: Withdraw this device's sources for one or all versions
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/OptionalPeerVersion' } }
      responses:
        '204': { description: Withdrawn idempotently }
        '400': { description: Invalid request }
        '401': { description: Current authentication required }
        '413': { description: Body exceeds 65536 bytes }
  /api/v1/p2p/sources:
    get:
      operationId: listPeerSources
      summary: Discover current eligible source devices
      description: At most 64 candidates, excluding this device. Requires current requester access, live source session, source file permission, and heartbeat within 60 seconds. Same-account other devices are eligible. Returned claims do not prove possession.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: versionId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Sources and ICE servers
          content:
            application/json:
              schema:
                type: object
                required: [sources, iceServers]
                properties:
                  sources: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/PeerSource' } }
                  iceServers: { type: array, items: { $ref: '#/components/schemas/ICEServer' } }
        '401': { description: Current authentication required }
        '403': { description: File access denied }
        '404': { description: File unavailable }
  /api/v1/p2p/allocate:
    post:
      operationId: allocateInitialPeerRegion
      summary: Allocate a disjoint initial download region among three devices
      description: Requires current actor/session/device and version read access. A 60-second in-memory lease, keyed by version and trusted device, selects the least occupied of min(3, chunkCount) contiguous regions. First three distinct devices receive disjoint regions regardless of their UUID values. Same-device retries and concurrent tasks reuse its live lease. At most 1024 live leases exist globally; expiry and periodic cleanup prune them. A zero-chunk file returns [0,0). This is a scheduling hint and grants no file access. Native coordination is optional with a three-second overall startup deadline and HTTP fallback.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [versionId, taskId]
              properties:
                versionId: { type: string, format: uuid }
                taskId: { type: string, format: uuid }
      responses:
        '200':
          description: Half-open initial region and lease expiry
          content:
            application/json:
              schema:
                type: object
                required: [startIndex, endIndex, expiresAt]
                properties:
                  startIndex: { type: integer, minimum: 0 }
                  endIndex: { type: integer, minimum: 0 }
                  expiresAt: { type: string, format: date-time }
        '400': { description: Invalid UUID or malformed input }
        '401': { description: Current authenticated session required }
        '403': { description: Current version permission denied }
        '404': { description: File version unavailable }
        '413': { description: Body exceeds 65536 bytes }
        '429': { description: Allocation capacity reached; use normal HTTP download }
  /api/v1/p2p/config:
    get:
      operationId: peerICEConfiguration
      summary: Get ICE configuration and temporary TURN credentials
      description: LINKNESTX_ICE_SERVERS supplies a JSON array. Default is empty for LAN host candidates. LINKNESTX_TURN_SHARED_SECRET generates TURN REST HMAC-SHA1 credentials for TURN URLs; LINKNESTX_TURN_CREDENTIAL_TTL defaults to 10m and allows 1m–1h. Username is expiryUnix:deviceId. Static paired username/credential is also supported. The shared secret is never returned. HTTP chunk streaming remains available when ICE fails.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: ICE configuration
          content:
            application/json:
              schema:
                type: object
                required: [iceServers]
                properties:
                  iceServers: { type: array, items: { $ref: '#/components/schemas/ICEServer' } }
        '401': { description: Current authentication required }
  /api/v1/p2p/grants:
    post:
      operationId: createPeerChunkGrant
      summary: Issue a signed grant for the current recipient device/session
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [versionId, chunkHash]
              properties:
                versionId: { type: string, format: uuid }
                chunkHash: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        '200':
          description: Grant expires within two minutes or at file expiry
          content:
            application/json: { schema: { $ref: '#/components/schemas/ChunkGrant' } }
        '401': { description: Current authentication required }
        '403': { description: File access denied }
        '404': { description: Version or chunk unavailable }
        '413': { description: Body exceeds 65536 bytes }
  /api/v1/p2p/grants/validate:
    post:
      operationId: validatePeerChunkGrant
      summary: Serving peer revalidates a recipient grant before every chunk
      description: Checks HMAC, expiry, both live sessions and current file permissions, and immutable hash/size. Serving native must additionally match grant userId/deviceId to the trusted signaling fromUserId/fromDeviceId of its DataChannel and match version/hash to the request. This endpoint does not transfer bytes or certify the caller's possession.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [grant]
              properties:
                grant: { $ref: '#/components/schemas/ChunkGrant' }
      responses:
        '204': { description: Current recipient and serving peer authorized }
        '400': { description: Invalid, tampered, or expired grant }
        '401': { description: Revoked or expired session }
        '403': { description: Either peer lost file permission }
        '404': { description: File unavailable }
        '413': { description: Body exceeds 65536 bytes }
  /api/v1/p2p/ws:
    get:
      operationId: peerSignalingSocket
      summary: Dedicated authenticated WebRTC signaling WebSocket
      description: >-
        Bearer header required; tokens in query strings are not accepted. Origin, if supplied, must match this host.
        First event is session.ready with deviceId and userId. Client sends PeerClientEvent; server forwards it with trusted
        fromDeviceId/fromUserId. Offered recipient must be a live announced source. A UUID connectionId binds two devices and
        one immutable version; answer is allowed once from offered source, ICE and close only from either member. No
        caller-supplied origin fields are accepted. Errors have type error, code, and optional connectionId; codes include
        invalid_input, invalid_connection, offline, unavailable, forbidden, rate_limited, internal_error. Frames are limited
        to 65536 bytes (oversize closes with 1009), burst 60 plus 2/second per session, max 16 active negotiations/device.
        Signaling state expires after two minutes without signaling and peer.close is sent; established native transfers may
        reconnect as needed. Disconnect/reconnect removes old pair state and sends peer.close to the counterpart. Permission
        and live auth are checked before every forward and queued delivery. This socket never transfers file bytes. Refresh
        requires reconnect and re-announcement; the new socket closes any older socket for this device.
      security: [{ bearerAuth: [] }]
      responses:
        '101': { description: WebSocket established }
        '401': { description: Current authentication required }
        '403': { description: Origin rejected }
  /api/v1/auth/password:
    post:
      operationId: changePassword
      security: [{ bearerAuth: [] }]
      description: Verifies current password, requires a different new password, preserves this session, and revokes all other sessions. Passwords require at least eight Unicode characters and at most 1024 UTF-8 bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200':
          description: Full updated user with mustChangePassword false
          content:
            application/json: { schema: { $ref: '#/components/schemas/User' } }
        '400': { description: Invalid or unchanged password }
        '401': { description: Current password or session invalid }
