        '409': { description: Another active download in this session }
        '413': { description: File larger than 1000000000 bytes; use desktop }
        '416': { description: Range requests are unsupported }
        '400': { description: Invalid request }
        '401': { description: Session missing, expired or revoked }
        '403': { description: Permission, origin, CSRF or browser capability denied }
        '404': { description: Resource unavailable }
    head:
      operationId: webDownloadMetadata
      security: [{ webCookie: [] }]
      responses:
        '200':
          description: Authenticated bounded stream; one active download per session; no Range support
          headers:
            Content-Disposition: { schema: { type: string }, description: Safe attachment filename }
            Content-Length: { schema: { type: integer, maximum: 1000000000 } }
        '409': { description: Another active download in this session }
        '413': { description: File larger than 1000000000 bytes; use desktop }
        '416': { description: Range requests are unsupported }
        '400': { description: Invalid request }
        '401': { description: Session missing, expired or revoked }
        '403': { description: Permission, origin, CSRF or browser capability denied }
        '404': { description: Resource unavailable }
  /api/v1/documents:
    get:
      operationId: listDocuments
      summary: List readable published notes, personal notes, drafts, or curated notes
      security: [{ bearerAuth: [] }, { webCookie: [] }]
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [feed, mine, drafts, public], default: feed } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Readable documents ordered by updated time; body truncated to 2000 characters with bodyTruncated flag and empty attachments; fetch an individual document for full content. Cursor is bound to scope and search.
          content:
            application/json: { schema: { $ref: '#/components/schemas/DocumentPage' } }
        '400': { description: Invalid pagination or search input }
        '401': { description: Authentication required }
    post:
      operationId: createDocument
      summary: Create a persistent Markdown note or private draft
      security: [{ bearerAuth: [] }, { webCookie: [] }]
      description: Browser writes require same-origin Origin and X-CSRF-Token. Body accepts up to 1 MiB of UTF-8 Markdown; raw HTML is rendered inert by clients.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/DocumentInput' } }
      responses:
        '201':
          description: Created document
          content:
            application/json: { schema: { $ref: '#/components/schemas/Document' } }
        '400': { description: Invalid document input }
  /api/v1/documents/{documentID}:
    parameters:
      - { name: documentID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getDocument
      security: [{ bearerAuth: [] }, { webCookie: [] }]
      responses:
        '200':
          description: Full document and all published attachment versions; drafts are owner-only even for administrators
          content:
            application/json: { schema: { $ref: '#/components/schemas/Document' } }
        '404': { description: Missing, deleted, or not readable }
    patch:
      operationId: updateDocument
      security: [{ bearerAuth: [] }, { webCookie: [] }]
      description: Full replacement with current revision. Curated documents are administrator-only and must remain published with team visibility. Browser administrator writes to curated documents are prohibited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/DocumentInput' }
                - { required: [revision] }
      responses:
        '200':
          description: Updated document with incremented revision
          content:
            application/json: { schema: { $ref: '#/components/schemas/Document' } }
        '403': { description: Write permission denied }
        '409': { description: Revision conflict; reload before saving }
    delete:
      operationId: deleteDocument
      security: [{ bearerAuth: [] }, { webCookie: [] }]
      parameters:
        - { name: revision, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: Document and all owned attachments made unavailable }
        '403': { description: Write permission denied }
        '409': { description: Revision conflict }
  /api/v1/documents/{documentID}/curation:
    parameters:
      - { name: documentID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: curateDocument
      summary: Add or remove a published team document from the administrator-curated library
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, curated]
              properties:
                revision: { type: integer, minimum: 1 }
                curated: { type: boolean }
      responses:
        '200':
          description: Updated document; curation locks author edits and attachment deletion/replacement
          content:
            application/json: { schema: { $ref: '#/components/schemas/Document' } }
        '403': { description: Native administrator session required }
        '409': { description: Revision conflict }
  /api/v1/documents/{documentID}/attachments/{versionID}/preview:
    parameters:
      - { name: documentID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: versionID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: previewDocumentImage
      security: [{ bearerAuth: [] }, { webCookie: [] }]
      description: Authenticated PNG/JPEG/GIF/WebP image bytes, maximum 10 MiB. No SVG or HTML. Document ACL is rechecked between bounded reads. Markdown attachment links use linknestx-file:VERSION_UUID; other files use the existing authenticated download routes.
      responses:
        '200': { description: Image bytes with nosniff and no-store headers }
        '403': { description: Attachment access denied }
        '404': { description: Version does not belong to the document or is unavailable }
        '413': { description: Image is too large for preview }
        '415': { description: Unsupported image content }
components:
  requestBodies:
    EmptyObject:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: false }
  parameters:
    AccountOrDeviceID: { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    AuditAction: { in: query, name: action, schema: { type: string, maxLength: 128 } }
    AuditActor: { in: query, name: actorId, schema: { type: string, format: uuid } }
    AuditDevice: { in: query, name: deviceId, schema: { type: string, format: uuid } }
    AuditFile: { in: query, name: fileId, schema: { type: string, format: uuid } }
    AuditVersion: { in: query, name: versionId, schema: { type: string, format: uuid } }
    AuditFrom: { in: query, name: from, schema: { type: string, format: date-time }, description: Inclusive UTC instant }
    AuditBefore: { in: query, name: before, schema: { type: string, format: date-time }, description: Exclusive UTC instant }
  securitySchemes:
    webCookie:
      type: apiKey
      in: cookie
      name: lnx_web
      description: HttpOnly SameSite Strict cookie; HTTPS Secure. Browser writes require Origin and X-CSRF-Token.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status: { type: string, const: ok }
        version: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        deviceId: { type: string, format: uuid }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        roles: { type: array, items: { type: string }, default: [user] }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    User:
      type: object
      required: [id, username, disabled, createdAt, mustChangePassword, accountNumber, displayName]
      properties:
        accountNumber: { type: string, pattern: '^[0-9]{8,}$', readOnly: true }
        displayName: { type: string, maxLength: 80 }
        avatarUrl: { type: string, description: Same-origin authenticated PNG path }
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        roles: { type: array, items: { type: string } }
        disabled: { type: boolean }
        mustChangePassword:
          type: boolean
          description: The account still uses its administrator-provided initial password.
        createdAt: { type: string, format: date-time }
    Session:
      type: object
      required: [accessToken, refreshToken, expiresAt, user, deviceId]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresAt: { type: string, format: date-time }
        deviceId: { type: string, format: uuid }
        user: { $ref: '#/components/schemas/User' }
    Group:
      type: object
      required: [id, name, createdBy, createdAt, isMember]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        isMember: { type: boolean, description: Only members can read or send ordinary chat }
    CreateGroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        ownerId: { type: string, format: uuid, description: Defaults to the creating administrator }
    GroupMemberRequest:
      type: object
      additionalProperties: false
      required: [userId, role]
      properties:
        userId: { type: string, format: uuid }
        role: { type: string, enum: [owner, member] }
    GroupMember:
      type: object
      required: [userId, role, joinedAt]
      properties:
        userId: { type: string, format: uuid }
        role: { type: string, enum: [owner, member] }
        joinedAt: { type: string, format: date-time }
    AppendMessageRequest:
      type: object
      additionalProperties: false
      required: [clientMessageId, body]
      properties:
        clientMessageId: { type: string, minLength: 1, maxLength: 128 }
        body: { type: string, minLength: 1, description: At most 16384 UTF-8 bytes; whitespace alone is rejected }
    Message:
      type: object
      required: [id, sequence, groupId, senderId, clientMessageId, body, createdAt, cursor]
      properties:
        conversationId: { type: string, format: uuid }
        sender: { $ref: '#/components/schemas/User' }
        readCount: { type: integer, minimum: 0, description: Current enabled entitled readers excluding sender }
        readByMe: { type: boolean }
        id: { type: string, format: uuid }
        sequence: { type: integer, format: int64, description: Monotonic server commit order; gaps between groups are normal }
        groupId: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        clientMessageId: { type: string }
        body: { type: [string, 'null'], description: Null after content retention expires }
        createdAt: { type: string, format: date-time }
        expiredAt: { type: string, format: date-time }
        cursor: { type: string, description: Opaque cursor through this message within its group }
        fileId: { type: string, format: uuid }
        fileVersionId: { type: string, format: uuid }
        attachmentName: { type: string, description: Original immutable version filename; absent after message retention expiry }
        attachmentSize: { type: integer, minimum: 0, description: Original immutable version size }
        attachmentStatus: { type: string, enum: [available, deleted, expired, unlisted] }
    MessagePage:
      type: object
      required: [messages, nextCursor, hasMore]
      properties:
        messages: { type: array, items: { $ref: '#/components/schemas/Message' } }
        nextCursor: { type: string }
        hasMore: { type: boolean }
    SocketClientEvent:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [message.send, ping] }
        requestId: { type: string, maxLength: 128 }
        groupId: { type: string, format: uuid }
        clientMessageId: { type: string, maxLength: 128 }
        body: { type: string }
    SocketEvent:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [session.ready, message.created, message.ack, presence.changed, membership.changed, files.changed, pong, error] }
        eventId: { type: string, format: uuid, description: Unique membership/file change event for notification deduplication }
        requestId: { type: string }
        groupId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        online: { type: boolean }
        clientMessageId: { type: string }
        message: { $ref: '#/components/schemas/Message' }
        code: { type: string, enum: [invalid_input, forbidden, conflict, invalid_event, internal_error] }
    FileChunk:
      type: object
      required: [index, hash, size]
      properties:
        index: { type: integer, minimum: 0 }
        hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        size: { type: integer, minimum: 1, maximum: 16777216 }
    StartUpload:
      type: object
      additionalProperties: false
      required: [name, size, sha256, chunks]
      oneOf:
        - { required: [groupId], not: { required: [documentId] } }
        - { required: [documentId], not: { required: [groupId] } }
      properties:
        groupId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        fileId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 255, description: Display metadata; path separators and control characters forbidden }
        size: { type: integer, minimum: 0, maximum: 20000000000 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        chunkSize: { type: integer, minimum: 1, maximum: 16777216, default: 4194304 }
        chunks: { type: array, maxItems: 20000, items: { $ref: '#/components/schemas/FileChunk' } }
    UploadSession:
      type: object
      required: [uploadId, fileId, versionId, missingIndexes, completed]
      properties:
        uploadId: { type: string, format: uuid }
        fileId: { type: string, format: uuid }
        versionId: { type: string, format: uuid }
        missingIndexes: { type: array, items: { type: integer, minimum: 0 } }
        completed: { type: boolean }
    File:
      type: object
      required: [id, groupId, name, createdBy, visibility, currentVersionId, createdAt, expiresAt, status, size, sha256]
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, description: Group UUID; empty for document files }
        documentId: { type: string, format: uuid }
        name: { type: string }
        createdBy: { type: string, format: uuid }
        visibility: { type: string, enum: [group, pool, document] }
        currentVersionId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [published] }
        size: { type: integer }
        sha256: { type: string }
        listed: { type: boolean, default: true, description: Unlisted pool files remain permanent and administrator-only }
    FileVersion:
      type: object
      required: [fileId, versionId, name, size, sha256, chunkSize, chunks, expiresAt, visibility, createdAt, createdBy, status]
      properties:
        fileId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        versionId: { type: string, format: uuid }
        name: { type: string }
        size: { type: integer }
        sha256: { type: string }
        chunkSize: { type: integer }
        chunks: { type: array, items: { $ref: '#/components/schemas/FileChunk' } }
        expiresAt: { type: [string, 'null'], format: date-time }
        visibility: { type: string, enum: [group, pool, document] }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, format: uuid }
        status: { type: string, enum: [published] }
        sharingPolicy: { $ref: '#/components/schemas/AdminSharingPolicy' }
    AdminSharingPolicy:
      type: object
      additionalProperties: false
      required: [enabled, maxConcurrent, bandwidthLimitBps]
      properties:
        enabled: { type: boolean, default: true }
        maxConcurrent: { type: integer, minimum: 0, maximum: 32, default: 0, description: Zero means unlimited; native uses minimum positive local/admin cap }
        bandwidthLimitBps: { type: integer, minimum: 0, default: 0, description: Zero means unlimited; per-version admin aggregate combines with local aggregate }
    OptionalPeerVersion:
      type: object
      additionalProperties: false
      properties:
        versionId: { type: string, format: uuid }
    ICEServer:
      type: object
      required: [urls]
      properties:
        urls: { type: array, items: { type: string } }
        username: { type: string }
        credential: { type: string }
    PeerSource:
      type: object
      required: [deviceId, userId, indexes, lastSeen]
      properties:
        deviceId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        indexes: { type: array, maxItems: 5000, items: { type: integer, minimum: 0 } }
        lastSeen: { type: string, format: date-time }
    PeerPayload:
      type: object
      additionalProperties: false
      properties:
        sdp: { type: string, description: Raw SDP for offer/answer }
        candidate: { type: string, maxLength: 8192, description: Empty means end of candidates }
        sdpMid: { type: [string, 'null'], maxLength: 256 }
        sdpMLineIndex: { type: [integer, 'null'], minimum: 0, maximum: 65535 }
    PeerClientEvent:
      type: object
      additionalProperties: false
      required: [type, toDeviceId, connectionId, versionId, payload]
      properties:
        type: { type: string, enum: [peer.offer, peer.answer, peer.ice, peer.close] }
        toDeviceId: { type: string, format: uuid }
        connectionId: { type: string, format: uuid }
        versionId: { type: string, format: uuid }
        payload: { $ref: '#/components/schemas/PeerPayload' }
    PeerServerEvent:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [session.ready, error, peer.offer, peer.answer, peer.ice, peer.close] }
        deviceId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        fromDeviceId: { type: string, format: uuid }
        fromUserId: { type: string, format: uuid }
        toDeviceId: { type: string, format: uuid }
        connectionId: { type: string, format: uuid }
        versionId: { type: string, format: uuid }
        payload: { $ref: '#/components/schemas/PeerPayload' }
        code: { type: string }
    ChunkGrant:
      type: object
      required: [userId, deviceId, sessionId, versionId, chunkHash, size, expiresAt, signature]
      properties:
        userId: { type: string, format: uuid }
        deviceId: { type: string }
        sessionId: { type: string, format: uuid }
        versionId: { type: string, format: uuid }
        chunkHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        size: { type: integer }
        expiresAt: { type: string, format: date-time }
        signature: { type: string, description: Server HMAC; serving peer must ask the server to revalidate current recipient and serving-peer authorization }
    DirectoryUser:
      type: object
      additionalProperties: false
      required: [id, username, email]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
    Device:
      type: object
      required: [id, createdAt, lastSeen, active, sessionCount, current]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid, description: Present in administrator list }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time, description: Most recent login or refresh }
        active: { type: boolean }
        sessionCount: { type: integer, minimum: 0 }
        current: { type: boolean }
    AuditEvent:
      type: object
      required: [id, action, actorId, targetId, deviceId, fileId, versionId, taskId, nodeId, bytes, source, createdAt]
      properties:
        id: { type: string }
        action: { type: string }
        actorId: { type: string }
        targetId: { type: string }
        deviceId: { type: string }
        fileId: { type: string }
        versionId: { type: string }
        taskId: { type: string }
        nodeId: { type: string }
        bytes: { type: integer, minimum: 0 }
        source: { type: string, enum: [server-observed, client-reported] }
        createdAt: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [events, total]
      properties:
        events: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        total: { type: integer, minimum: 0 }
    ClientTransfer:
      type: object
      additionalProperties: false
      required: [taskId, versionId, nodeId, action, bytes]
      properties:
        taskId: { type: string, format: uuid }
        versionId: { type: string, format: uuid }
        nodeId: { type: string, description: Peer device UUID or server for source contribution; local only for download.completed }
        action: { type: string, enum: [peer.sent, peer.received, transfer.completed, download.completed] }
        bytes: { type: integer, minimum: 0, maximum: 20000000000 }

    EmptyRequest: { type: object, additionalProperties: false }
    ProfilePatch:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
    FriendRequestInput:
      type: object
      additionalProperties: false
      required: [accountNumber]
      properties:
        accountNumber: { type: string, pattern: '^[0-9]{8,}$' }
    DirectInput:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
    FriendRequest:
      type: object
      required: [id, from, to, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        from: { $ref: '#/components/schemas/User' }
        to: { $ref: '#/components/schemas/User' }
        status: { type: string, enum: [pending, accepted, rejected, cancelled] }
        createdAt: { type: string, format: date-time }
    Contacts:
      type: object
      required: [friends, incoming, outgoing]
      properties:
        friends: { type: array, items: { $ref: '#/components/schemas/User' } }
        incoming: { type: array, items: { $ref: '#/components/schemas/FriendRequest' } }
        outgoing: { type: array, items: { $ref: '#/components/schemas/FriendRequest' } }
    Conversation:
      type: object
      required: [id, kind, title, memberCount, unreadCount, canSend]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [group, direct] }
        title: { type: string }
        avatarUrl: { type: string }
        peer: { $ref: '#/components/schemas/User' }
        memberCount: { type: integer, minimum: 0 }
        unreadCount: { type: integer, minimum: 0 }
        lastMessage: { $ref: '#/components/schemas/Message' }
        canSend: { type: boolean }
    Conversations: { type: array, items: { $ref: '#/components/schemas/Conversation' } }
    ReadInput:
      type: object
      additionalProperties: false
      required: [messageIds]
      properties:
        messageIds: { type: array, minItems: 1, maxItems: 100, items: { type: string, format: uuid } }
    ReadConfirmation:
      type: object
      required: [messageIds]
      properties:
        messageIds: { type: array, uniqueItems: true, maxItems: 100, items: { type: string, format: uuid } }
    Reader:
      allOf:
        - { $ref: '#/components/schemas/User' }
        - type: object
          required: [readAt]
          properties:
            readAt: { type: string, format: date-time }
    Readers:
      type: object
      required: [readers, count]
      properties:
        readers: { type: array, items: { $ref: '#/components/schemas/Reader' } }
        count: { type: integer, minimum: 0 }
    WebSession:
      type: object
      required: [user, expiresAt, csrfToken, capabilities]
      properties:
        user: { $ref: '#/components/schemas/User' }
        expiresAt: { type: string, format: date-time }
        csrfToken: { type: string }
        capabilities:
          type: object
          required: [upload, p2p, adminWrite, profileEdit, nativeTransfers, updates, maxDownloadBytes]
          properties:
            upload: { type: boolean, const: false }
            p2p: { type: boolean, const: false }
            adminWrite: { type: boolean, const: false }
            profileEdit: { type: boolean, const: false }
            nativeTransfers: { type: boolean, const: false }
            updates: { type: boolean, const: false }
            maxDownloadBytes: { type: integer, const: 1000000000 }

    DocumentInput:
      type: object
      additionalProperties: false
      required: [title, body, visibility, status]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, description: 'Required Markdown source, maximum 1048576 UTF-8 bytes. Explicit empty string is valid; omitted or null body is rejected.' }
        visibility: { type: string, enum: [private, friends, team] }
        status: { type: string, enum: [draft, published] }
        revision: { type: integer, minimum: 1 }
    Document:
      type: object
      required: [id, title, body, bodyTruncated, visibility, status, curated, revision, author, createdAt, updatedAt, canEdit, canDelete, canCurate, attachments]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        bodyTruncated: { type: boolean }
        visibility: { type: string, enum: [private, friends, team] }
        status: { type: string, enum: [draft, published] }
        curated: { type: boolean }
        revision: { type: integer, minimum: 1 }
        author:
          type: object
          required: [id, username, displayName, accountNumber]
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
            displayName: { type: string }
            accountNumber: { type: string }
            avatarUrl: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time }
        canEdit: { type: boolean }
        canDelete: { type: boolean }
        canCurate: { type: boolean }
        attachments: { type: array, items: { $ref: '#/components/schemas/DocumentAttachment' } }
    DocumentPage:
      type: object
      required: [documents, nextCursor, hasMore]
      properties:
        documents: { type: array, items: { $ref: '#/components/schemas/Document' } }
        nextCursor: { type: string }
        hasMore: { type: boolean }

    DocumentAttachment:
      allOf:
        - { $ref: '#/components/schemas/File' }
        - type: object
          required: [versionId]
          properties:
            versionId: { type: string, format: uuid, description: Immutable attachment version for link resolution; currentVersionId remains the latest logical file version }
