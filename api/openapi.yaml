openapi: 3.1.0
info:
  title: LinkNestX API
  version: 0.1.0
  description: Authenticated API for LAN and internet collaboration.
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /healthz:
    get:
      operationId: health
      summary: Check server health
      responses:
        '200':
          description: Server is ready to accept requests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } }
      responses:
        '200':
          description: Authenticated session
          content:
            application/json: { schema: { $ref: '#/components/schemas/Session' } }
        '401': { description: Invalid credentials }
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RefreshRequest' } }
      responses:
        '200':
          description: Rotated authenticated session
          content:
            application/json: { schema: { $ref: '#/components/schemas/Session' } }
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses: { '204': { description: Session revoked } }
  /api/v1/me:
    get:
      operationId: currentUser
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current account
          content:
            application/json: { schema: { $ref: '#/components/schemas/User' } }
  /api/v1/users:
    post:
      operationId: createUser
      summary: Create a local account (current administrators only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateUserRequest' } }
      responses:
        '201':
          description: Local account created with an initial password
          content:
            application/json: { schema: { $ref: '#/components/schemas/User' } }
        '400': { description: Invalid account input }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status: { type: string, const: ok }
        version: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        deviceId: { type: string, format: uuid }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        roles: { type: array, items: { type: string }, default: [user] }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    User:
      type: object
      required: [id, username, disabled, createdAt, mustChangePassword]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        roles: { type: array, items: { type: string } }
        disabled: { type: boolean }
        mustChangePassword:
          type: boolean
          description: The account still uses its administrator-provided initial password.
        createdAt: { type: string, format: date-time }
    Session:
      type: object
      required: [accessToken, refreshToken, expiresAt, user, deviceId]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresAt: { type: string, format: date-time }
        deviceId: { type: string, format: uuid }
        user: { $ref: '#/components/schemas/User' }
