    get:
      operationId: adminUsers
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: All accounts including disabled accounts; current administrator required
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/User' } } }
  /api/v1/admin/users/{id}/disable:
    parameters: [{ $ref: '#/components/parameters/AccountOrDeviceID' }]
    post:
