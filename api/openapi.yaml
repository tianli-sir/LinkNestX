  /api/v1/admin/audit:
    get:
      operationId: adminAudit
      security: [{ bearerAuth: [] }]
      description: Current administrators only. Document events and attachment records require current document read access; filtering occurs before counting or pagination. Events and aggregates ordered by UTC createdAt then id descending. Offset pagination is stable for an unchanged result set.
      parameters:
        - { $ref: '#/components/parameters/AuditAction' }
        - { $ref: '#/components/parameters/AuditActor' }
        - { $ref: '#/components/parameters/AuditDevice' }
        - { $ref: '#/components/parameters/AuditFile' }
        - { $ref: '#/components/parameters/AuditVersion' }
        - { $ref: '#/components/parameters/AuditFrom' }
        - { $ref: '#/components/parameters/AuditBefore' }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 1000, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 10000000, default: 0 } }
      responses:
        '200':
          description: Filtered events and total count
          content:
            application/json: { schema: { $ref: '#/components/schemas/AuditPage' } }
        '400': { description: Invalid filter or pagination }
        '403': { description: Current initialized administrator required }
  /api/v1/admin/audit/export:
    get:
      operationId: exportAudit
      security: [{ bearerAuth: [] }]
      description: >-
        Complete filtered export, independent of UI pagination. Fixed UTC cutoff
        and timestamp/id keyset, in batches of 200; database resources are released
        before response writes. Aggregate rows updated after cutoff are excluded.
        Administrator permissions and document read access are rechecked between batches. On error after output begins,
        the HTTP stream is aborted (HTTP/1 connection closure or HTTP/2 reset).
        Consumers must treat transport errors as failure and publish saved files
        only after a complete successful body. CSV protects spreadsheet formulas;
        JSON contains events and the actual exported total. Cache-Control no-store.
      parameters:
        - { in: query, name: format, schema: { type: string, enum: [csv, json], default: csv } }
        - { $ref: '#/components/parameters/AuditAction' }
        - { $ref: '#/components/parameters/AuditActor' }
        - { $ref: '#/components/parameters/AuditDevice' }
        - { $ref: '#/components/parameters/AuditFile' }
        - { $ref: '#/components/parameters/AuditVersion' }
        - { $ref: '#/components/parameters/AuditFrom' }
        - { $ref: '#/components/parameters/AuditBefore' }
      responses:
        '200':
          description: Streamed attachment named linknestx-audit.csv or linknestx-audit.json
          headers:
            Content-Disposition: { schema: { type: string }, description: attachment with fixed filename }
          content:
            text/csv: { schema: { type: string } }
            application/json: { schema: { $ref: '#/components/schemas/AuditPage' } }
  /api/v1/p2p/transfers:
    post:
      operationId: reportClientTransfer
      security: [{ bearerAuth: [] }]
      description: Cumulative client-reported counters, authenticated by current user/device/session and current version ACL. Max bytes upsert per user/device/task/version/node/action makes retry idempotent. Peer attribution uses a durable device identity or a recorded negotiation for the reporting device pair and version, so delayed history remains reportable after the other participant logs out, loses membership, is disabled, or has its device revoked. Current reporter/session/version permissions remain required. This does not authorize new chunk access; server is allowed only for transfer.completed. download.completed requires nodeId=local and bytes equal the complete version size, including zero; it records a successful save without attributing network traffic. Acknowledgement does not prove delivery and must not gate verified local delivery.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ClientTransfer' } }
      responses:
        '204': { description: Client report accepted }
        '400': { description: Invalid UUID, action, or counter exceeding version size }
        '403': { description: Current version or peer access denied }
  /api/v1/sharing-policies/{scope}/{targetId}:
    parameters:
      - { name: scope, in: path, required: true, schema: { type: string, enum: [group, pool] } }
      - { name: targetId, in: path, required: true, schema: { type: string, format: uuid }, description: Group ID for group scope; public-pool file ID for pool scope }
    get:
      operationId: getAdminSharingPolicy
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Authoritative policy; absent setting defaults to allowed/unlimited
          content:
            application/json: { schema: { $ref: '#/components/schemas/AdminSharingPolicy' } }
        '403': { description: Administrator required }
        '404': { description: Target unavailable }
    put:
      operationId: setAdminSharingPolicy
      description: Audited policy controls P2P announcements, discovery, offers and per-chunk validation. Disabled P2P returns 409; ordinary authorized HTTP downloads stay available. Pool-file policy supersedes the originating group policy.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AdminSharingPolicy' } }
      responses:
        '204': { description: Policy saved }
        '400': { description: Invalid limits }
        '403': { description: Administrator required }
        '404': { description: Target unavailable }
