openapi: 3.1.0
info:
  title: LinkNestX API
  version: 0.1.0
  description: Authenticated API for LAN and internet collaboration.
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /healthz:
    get:
      operationId: health
      summary: Check server health
      responses:
        '200':
          description: Server is ready to accept requests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } }
      responses:
        '200':
          description: Authenticated session
          content:
            application/json: { schema: { $ref: '#/components/schemas/Session' } }
        '401': { description: Invalid credentials }
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RefreshRequest' } }
      responses:
        '200':
          description: Rotated authenticated session
          content:
            application/json: { schema: { $ref: '#/components/schemas/Session' } }
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses: { '204': { description: Session revoked } }
  /api/v1/me:
    get:
      operationId: currentUser
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current account
          content:
            application/json: { schema: { $ref: '#/components/schemas/User' } }
  /api/v1/users:
    post:
      operationId: createUser
      summary: Create a local account (current administrators only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateUserRequest' } }
      responses:
        '201':
          description: Local account created with an initial password
          content:
            application/json: { schema: { $ref: '#/components/schemas/User' } }
        '400': { description: Invalid account input }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
  /api/v1/groups:
    get:
      operationId: listGroups
      summary: List groups the current account belongs to
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Groups in creation order
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Group' } } }
        '401': { description: Authentication required }
    post:
      operationId: createGroup
      summary: Create a group (administrators only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateGroupRequest' } }
      responses:
        '201':
          description: Group created with its first owner
          content:
            application/json: { schema: { $ref: '#/components/schemas/Group' } }
        '400': { description: Invalid group name }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '404': { description: Owner account does not exist or is disabled }
  /api/v1/groups/{groupId}/members:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listGroupMembers
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Members of the current group
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/GroupMember' } } }
        '401': { description: Authentication required }
        '403': { description: Current group membership required }
    post:
      operationId: addGroupMember
      summary: Add a member or change their role (group owners or administrators)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/GroupMemberRequest' } }
      responses:
        '204': { description: Membership saved }
        '400': { description: Invalid role or last owner would be demoted }
        '401': { description: Authentication required }
        '403': { description: Group owner or administrator required }
        '404': { description: Group or enabled target account does not exist }
  /api/v1/groups/{groupId}/members/{userId}:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: removeGroupMember
      summary: Remove membership immediately (group owners or administrators)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Membership absent; existing history remains }
        '400': { description: The last owner cannot be removed }
        '401': { description: Authentication required }
        '403': { description: Group owner or administrator required }
        '404': { description: Group does not exist }
  /api/v1/groups/{groupId}/messages:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listGroupMessages
      summary: Fetch durable history after a group cursor
      description: >-
        Messages are returned in ascending commit sequence, including retained
        tombstones. An absent cursor starts at the oldest message. Save nextCursor
        even when hasMore is false and use it to resume after disconnecting.
        Connect the WebSocket first, then fetch history and merge by message ID
        and sequence; this closes the gap between catch-up and live delivery.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: Opaque cursor from this group's previous page or message }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Ordered history page
          content:
            application/json: { schema: { $ref: '#/components/schemas/MessagePage' } }
        '400': { description: Invalid cursor or limit }
        '401': { description: Authentication required }
        '403': { description: Current group membership required }
    post:
      operationId: appendGroupMessage
      summary: Persist a message; retry with the same clientMessageId
      description: >-
        clientMessageId is unique per sender across groups. A retry returns the
        original message. Reuse with another group or different live content
        returns 409. Expired IDs return their content-free tombstone and never
        restore their original body. Sender and group are derived from the
        authenticated request and path, never from JSON actor or group fields.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AppendMessageRequest' } }
      responses:
        '201':
          description: Durable message, including the original on an identical retry
          content:
            application/json: { schema: { $ref: '#/components/schemas/Message' } }
        '400': { description: Invalid input; body is limited to 16384 UTF-8 bytes }
        '401': { description: Authentication required }
        '403': { description: Current group membership required }
        '409': { description: Client message ID reused with different content or group }
  /api/v1/ws:
    get:
      operationId: collaborationSocket
      summary: Native client WebSocket for all currently joined groups
      description: >-
        Upgrade with Authorization Bearer; query-string tokens are not accepted.
        session.ready is the first envelope. Send message.send with requestId,
        groupId, clientMessageId and body. Receive message.ack with requestId,
        clientMessageId and the persisted Message. Newly committed messages emit
        message.created to current group members, including the sender. Identical
        retries emit an acknowledgement without another created event. Use
        message.sequence to order and message.id to merge REST and live events;
        only advance a history cursor after filling any gap via REST.
        presence.changed has groupId, userId and online and is visible only to
        current members sharing that group. Send ping with requestId to receive
        pong. error replies carry requestId and code (invalid_input, forbidden,
        conflict, invalid_event, internal_error). Membership and session state
        are checked on sends and immediately before delivery. Revoked, disabled
        or expired sessions are disconnected on the next event or heartbeat.
        Slow consumers are disconnected and recover through REST cursor catch-up.
        The typed envelope can be extended with P2P events in a later version;
        currently unsupported event types receive invalid_event.
      security: [{ bearerAuth: [] }]
      responses:
        '101': { description: WebSocket upgraded; envelopes follow SocketEvent }
        '400': { description: Invalid upgrade request }
        '401': { description: Authentication required }
  /api/v1/files/uploads:
    post:
      operationId: startFileUpload
      summary: Start a private pending upload; each chunk needs its own verified receipt
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/StartUpload' } }
      responses:
        '201':
          description: Pending upload; no file is published yet
          content:
            application/json: { schema: { $ref: '#/components/schemas/UploadSession' } }
        '400': { description: Invalid bounded manifest or name }
        '403': { description: Current group membership or administrator file-management permission required }
  /api/v1/uploads/{uploadId}:
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: resumeFileUpload
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Original uploader's missing receipts; completed uploads have none
          content:
            application/json: { schema: { $ref: '#/components/schemas/UploadSession' } }
        '403': { description: Original uploader and current permission required }
        '404': { description: Upload expired or file unavailable }
  /api/v1/uploads/{uploadId}/chunks/{index}:
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: index, in: path, required: true, schema: { type: integer, minimum: 0 } }
    put:
      operationId: putFileChunk
      description: Each chunk request has a two-minute body-read deadline. Incomplete requests may be retried against the same upload.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        '204': { description: Exact manifest length and SHA-256 verified; receipt persisted }
        '400': { description: Incorrect index, length, or hash }
        '403': { description: Upload permission revoked }
        '404': { description: Upload expired or file unavailable }
  /api/v1/uploads/{uploadId}/complete:
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: completeFileUpload
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Full server copy verified and atomically published with one group attachment; retry returns the same version
          content:
            application/json: { schema: { $ref: '#/components/schemas/FileVersion' } }
        '400': { description: Whole-file SHA-256 mismatch }
        '409': { description: Upload receipts incomplete or message ID conflict }
  /api/v1/files:
    get:
      operationId: listFiles
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: groupId, in: query, description: Supply groupId or scope=pool, schema: { type: string, format: uuid } }
        - { name: scope, in: query, schema: { type: string, enum: [pool] } }
      responses:
        '200':
          description: Accessible published live files
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/File' } } }
        '401': { description: Authentication required }
        '403': { description: Group membership required }
  /api/v1/files/{fileId}/versions:
    parameters:
      - { name: fileId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listFileVersions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Accessible immutable versions; chunks are fetched through each manifest
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FileVersion' } } }
    post:
      operationId: createFileVersion
      summary: Start a pending replacement version through the normal upload flow
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/StartUpload' } }
      responses:
        '201':
          description: Pending upload for the same logical file
          content:
            application/json: { schema: { $ref: '#/components/schemas/UploadSession' } }
  /api/v1/file-versions/{versionId}/manifest:
    parameters:
      - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: fileManifest
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Immutable server-authoritative manifest
          content:
            application/json: { schema: { $ref: '#/components/schemas/FileVersion' } }
        '403': { description: File access denied }
        '404': { description: Version pending, expired, deleted, or absent }
  /api/v1/files/{versionId}/chunks/{hash}:
    parameters:
      - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: hash, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
    get:
      operationId: downloadFileChunk
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: X-Transfer-ID, in: header, description: Optional task identifier for aggregate server delivery records, schema: { type: string, maxLength: 128 } }
      responses:
        '200':
          description: Entire chunk stream with exact Content-Length; permissions and lifecycle rechecked for every request
          headers:
            Content-Length: { schema: { type: integer, minimum: 1 } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '403': { description: Current access revoked }
        '404': { description: Version or stored chunk unavailable }
    head:
      operationId: inspectFileChunk
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Authenticated chunk headers only; no bytes delivered or transfer accounting recorded
          headers:
            Content-Length: { schema: { type: integer, minimum: 1 } }
        '403': { description: Current access revoked }
        '404': { description: Version or stored chunk unavailable }
  /api/v1/files/{fileId}/promote:
    parameters:
      - { name: fileId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: promoteFile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Administrator promotion; all live versions lose automatic expiry
          content:
            application/json: { schema: { $ref: '#/components/schemas/File' } }
        '403': { description: Current administrator required }
  /api/v1/files/{fileId}:
    parameters:
      - { name: fileId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteFile
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: File unavailable immediately; shared bytes retained until no live references }
        '403': { description: Uploader, group owner, or administrator required; pool files require administrator }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status: { type: string, const: ok }
        version: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        deviceId: { type: string, format: uuid }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        roles: { type: array, items: { type: string }, default: [user] }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    User:
      type: object
      required: [id, username, disabled, createdAt, mustChangePassword]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        roles: { type: array, items: { type: string } }
        disabled: { type: boolean }
        mustChangePassword:
          type: boolean
          description: The account still uses its administrator-provided initial password.
        createdAt: { type: string, format: date-time }
    Session:
      type: object
      required: [accessToken, refreshToken, expiresAt, user, deviceId]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresAt: { type: string, format: date-time }
        deviceId: { type: string, format: uuid }
        user: { $ref: '#/components/schemas/User' }
    Group:
      type: object
      required: [id, name, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    CreateGroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        ownerId: { type: string, format: uuid, description: Defaults to the creating administrator }
    GroupMemberRequest:
      type: object
      additionalProperties: false
      required: [userId, role]
      properties:
        userId: { type: string, format: uuid }
        role: { type: string, enum: [owner, member] }
    GroupMember:
      type: object
      required: [userId, role, joinedAt]
      properties:
        userId: { type: string, format: uuid }
        role: { type: string, enum: [owner, member] }
        joinedAt: { type: string, format: date-time }
    AppendMessageRequest:
      type: object
      additionalProperties: false
      required: [clientMessageId, body]
      properties:
        clientMessageId: { type: string, minLength: 1, maxLength: 128 }
        body: { type: string, minLength: 1, description: At most 16384 UTF-8 bytes; whitespace alone is rejected }
    Message:
      type: object
      required: [id, sequence, groupId, senderId, clientMessageId, body, createdAt, cursor]
      properties:
        id: { type: string, format: uuid }
        sequence: { type: integer, format: int64, description: Monotonic server commit order; gaps between groups are normal }
        groupId: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        clientMessageId: { type: string }
        body: { type: [string, 'null'], description: Null after content retention expires }
        createdAt: { type: string, format: date-time }
        expiredAt: { type: string, format: date-time }
        cursor: { type: string, description: Opaque cursor through this message within its group }
        fileId: { type: string, format: uuid }
        fileVersionId: { type: string, format: uuid }
        attachmentStatus: { type: string, enum: [available, deleted, expired] }
    MessagePage:
      type: object
      required: [messages, nextCursor, hasMore]
      properties:
        messages: { type: array, items: { $ref: '#/components/schemas/Message' } }
        nextCursor: { type: string }
        hasMore: { type: boolean }
    SocketClientEvent:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [message.send, ping] }
        requestId: { type: string, maxLength: 128 }
        groupId: { type: string, format: uuid }
        clientMessageId: { type: string, maxLength: 128 }
        body: { type: string }
    SocketEvent:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [session.ready, message.created, message.ack, presence.changed, pong, error] }
        requestId: { type: string }
        groupId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        online: { type: boolean }
        clientMessageId: { type: string }
        message: { $ref: '#/components/schemas/Message' }
        code: { type: string, enum: [invalid_input, forbidden, conflict, invalid_event, internal_error] }
    FileChunk:
      type: object
      required: [index, hash, size]
      properties:
        index: { type: integer, minimum: 0 }
        hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        size: { type: integer, minimum: 1, maximum: 16777216 }
    StartUpload:
      type: object
      additionalProperties: false
      required: [groupId, name, size, sha256, chunks]
      properties:
        groupId: { type: string, format: uuid }
        fileId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 255, description: Display metadata; path separators and control characters forbidden }
        size: { type: integer, minimum: 0, maximum: 20000000000 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        chunkSize: { type: integer, minimum: 1, maximum: 16777216, default: 4194304 }
        chunks: { type: array, maxItems: 20000, items: { $ref: '#/components/schemas/FileChunk' } }
    UploadSession:
      type: object
      required: [uploadId, fileId, versionId, missingIndexes, completed]
      properties:
        uploadId: { type: string, format: uuid }
        fileId: { type: string, format: uuid }
        versionId: { type: string, format: uuid }
        missingIndexes: { type: array, items: { type: integer, minimum: 0 } }
        completed: { type: boolean }
    File:
      type: object
      required: [id, groupId, name, createdBy, visibility, currentVersionId, createdAt, expiresAt, status, size, sha256]
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        name: { type: string }
        createdBy: { type: string, format: uuid }
        visibility: { type: string, enum: [group, pool] }
        currentVersionId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [published] }
        size: { type: integer }
        sha256: { type: string }
    FileVersion:
      type: object
      required: [fileId, versionId, name, size, sha256, chunkSize, chunks, expiresAt, visibility, createdAt, createdBy, status]
      properties:
        fileId: { type: string, format: uuid }
        versionId: { type: string, format: uuid }
        name: { type: string }
        size: { type: integer }
        sha256: { type: string }
        chunkSize: { type: integer }
        chunks: { type: array, items: { $ref: '#/components/schemas/FileChunk' } }
        expiresAt: { type: [string, 'null'], format: date-time }
        visibility: { type: string, enum: [group, pool] }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, format: uuid }
        status: { type: string, enum: [published] }
    ChunkGrant:
      type: object
      required: [userId, deviceId, sessionId, versionId, chunkHash, size, expiresAt, signature]
      properties:
        userId: { type: string, format: uuid }
        deviceId: { type: string }
        sessionId: { type: string, format: uuid }
        versionId: { type: string, format: uuid }
        chunkHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        size: { type: integer }
        expiresAt: { type: string, format: date-time }
        signature: { type: string, description: Server HMAC; serving peer must ask the server to revalidate current recipient and serving-peer authorization }
