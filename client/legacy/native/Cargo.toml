[package]
name = "linknestx-legacy-native"
version = "0.3.0"
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-only"
publish = false

[features]
default = ["legacy-host"]
legacy-host = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "io-std", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "stream"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
tempfile = "3"
webrtc = "0.14"
bytes = "1"
libc = "0.2"
base64 = "0.22"
png = "0.18.1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
axum = { version = "0.8", features = ["ws"] }

[profile.release]
panic = "abort"
strip = true
