name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: server/go.sum
      - name: Server tests, race detector and static analysis
        run: |
          go test -mod=readonly ./server/...
          go test -race -mod=readonly ./server/...
          go vet -mod=readonly ./server/...
  desktop:
    name: Test and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
      - name: Install locked frontend dependencies
        working-directory: client
        run: npm ci
      - name: Go tests
        if: runner.os != 'Windows'
        run: go test -mod=readonly ./server/...
      - name: Frontend tests and production build
        working-directory: client
        run: |
          npm test
          npm run build
      - name: Native tests
        run: cargo test --locked --manifest-path client/src-tauri/Cargo.toml
      - name: Real Go and native multi-source smoke
        if: runner.os != 'Windows'
        run: bash scripts/smoke-test.sh
      - name: Build native application without installers
        working-directory: client
        run: npm run tauri -- build --ci --debug --no-bundle -- --locked
      - name: Check script syntax and package command
        run: |
          bash -n scripts/dev-server.sh scripts/package-client.sh scripts/smoke-test.sh
          node --test scripts/test-smoke-script.mjs
          bash scripts/dev-server.sh --dry-run
          bash scripts/package-client.sh --unsigned --dry-run
