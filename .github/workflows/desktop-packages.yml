name: Unsigned desktop packages

# Manually requested build artifacts only. This workflow never creates a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: linknestx-macos-arm64-unsigned
            bundles: app,dmg
            target: aarch64-apple-darwin
          - os: windows-2025
            artifact: linknestx-windows-x64-unsigned
            bundles: nsis,msi
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
      - name: Install locked frontend dependencies
        working-directory: client
        run: npm ci
      - name: Frontend and native tests
        run: |
          npm --prefix client test
          cargo test --locked --manifest-path client/src-tauri/Cargo.toml
      - name: Build unsigned installers
        env:
          PACKAGE_BUNDLES: ${{ matrix.bundles }}
          PACKAGE_TARGET: ${{ matrix.target }}
        run: bash scripts/package-client.sh --unsigned --bundles "$PACKAGE_BUNDLES" --target "$PACKAGE_TARGET"
      - name: Retain unsigned installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            client/src-tauri/target/*/release/bundle/dmg/*.dmg
            client/src-tauri/target/*/release/bundle/nsis/*.exe
            client/src-tauri/target/*/release/bundle/msi/*.msi
