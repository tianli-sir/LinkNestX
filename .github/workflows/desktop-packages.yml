name: Unsigned desktop packages

# Manually requested build artifacts only. This workflow never creates a release.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop packages to build
        type: choice
        default: all
        options: [all, windows, macos]

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-2025"]' || inputs.platform == 'macos' && '["macos-15"]' || '["macos-15","windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.os == 'windows-2025' && 'x86_64-pc-windows-msvc' || 'aarch64-apple-darwin' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
          cache-on-failure: "true"
      - name: Install locked frontend dependencies
        working-directory: client
        run: npm ci
      - name: Frontend and native tests
        id: native-tests
        run: |
          npm --prefix client test
          npm --prefix client run build
          cargo test --locked --no-fail-fast --manifest-path client/src-tauri/Cargo.toml
      - name: Diagnose Windows native loader failure
        if: failure() && runner.os == 'Windows' && steps.native-tests.outcome == 'failure'
        shell: pwsh
        run: ./scripts/diagnose-windows-loader.ps1
      - name: Retain Windows loader diagnostics
        if: failure() && runner.os == 'Windows' && steps.native-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: windows-loader-diagnostics-packages
          path: .cache/windows-loader-diagnostics*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Build unsigned installers
        env:
          PACKAGE_BUNDLES: ${{ matrix.os == 'windows-2025' && 'nsis,msi' || 'app,dmg' }}
          PACKAGE_TARGET: ${{ matrix.os == 'windows-2025' && 'x86_64-pc-windows-msvc' || 'aarch64-apple-darwin' }}
        run: bash scripts/package-client.sh --unsigned --bundles "$PACKAGE_BUNDLES" --target "$PACKAGE_TARGET"
      - name: Retain unsigned installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os == 'windows-2025' && 'linknestx-windows-x64-unsigned' || 'linknestx-macos-arm64-unsigned' }}
          if-no-files-found: error
          retention-days: 14
          path: |
            client/src-tauri/target/*/release/bundle/dmg/*.dmg
            client/src-tauri/target/*/release/bundle/nsis/*.exe
            client/src-tauri/target/*/release/bundle/msi/*.msi
